<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>러브버그FC 조끼세탁순서</title>
<style>
  :root{
    --bg-top:#FDF2EF;
    --bg-bottom:#F6DFDD;
    --card:#FFFFFF;
    --rose:#A65D6B;
    --rose-btn:#C17B87;
    --rose-btn-deep:#9C5A66;
    --rose-soft:#F0C9CE;
    --ink:#4A3B40;
    --gold:#C99A4A;
    --muted:#A8919A;
    --line:rgba(74,59,64,0.09);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:
      radial-gradient(circle at 50% -10%, var(--bg-top) 0%, var(--bg-bottom) 65%);
    color:var(--ink);
    min-height:100vh;
    padding:28px 16px 60px;
  }
  .wrap{max-width:560px;margin:0 auto;}

  .header-row{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:6px;
  }
  .logo{
    width:44px;
    height:44px;
    border-radius:50%;
    flex-shrink:0;
    box-shadow:0 3px 10px rgba(166,93,107,0.25);
  }
  .kicker{font-size:13px;color:var(--muted);margin-bottom:0;}
  h1{
    font-size:28px;
    font-weight:800;
    letter-spacing:-0.02em;
    margin:0 0 24px;
    line-height:1.2;
    color:var(--ink);
  }
  h1 span{color:var(--rose);}

  .weekcard{
    background:var(--card);
    border:1px solid var(--rose-soft);
    box-shadow:0 8px 24px rgba(166,93,107,0.12);
    border-radius:18px;
    padding:22px;
    position:relative;
    overflow:hidden;
    margin-bottom:20px;
  }
  .weekcard::before{
    content:"";
    position:absolute;
    right:-40px;top:-40px;
    width:160px;height:160px;
    border:2px solid var(--rose-soft);
    border-radius:50%;
  }
  .week-label{font-size:13px;color:var(--rose);font-weight:700;margin-bottom:10px;}
  .week-status{font-size:18px;font-weight:700;line-height:1.5;color:var(--ink);}
  .week-status b{color:var(--rose);}
  .week-status.empty{color:var(--muted);font-weight:500;font-size:15px;}

  .section{margin-top:32px;}
  .section-title{
    font-size:14px;
    font-weight:700;
    margin-bottom:12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    color:var(--ink);
  }
  .section-title small{font-weight:500;color:var(--muted);font-size:12px;}

  .board{
    background:var(--card);
    border:1px solid var(--line);
    box-shadow:0 4px 16px rgba(166,93,107,0.08);
    border-radius:14px;
    overflow:hidden;
  }
  .board-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 16px;
    border-bottom:1px solid var(--line);
  }
  .board-row:last-child{border-bottom:none;}
  .rank{width:20px;font-size:13px;font-weight:800;color:var(--muted);text-align:center;}
  .rank.first{color:var(--gold);}
  .board-name{flex:1;font-size:15px;font-weight:600;color:var(--ink);}
  .board-bar-wrap{
    flex:1;height:6px;background:var(--rose-soft);
    border-radius:3px;overflow:hidden;max-width:80px;
    opacity:0.5;
  }
  .board-bar{height:100%;background:var(--rose);border-radius:3px;}
  .board-count{font-size:15px;font-weight:800;color:var(--rose);width:34px;text-align:right;}
  .board-empty{padding:24px 16px;text-align:center;color:var(--muted);font-size:13px;}
  .del-btn{background:none;border:none;color:var(--muted);font-size:16px;padding:2px 4px;cursor:pointer;}

  .check-btn{
    background:var(--rose-btn);
    color:#FFFFFF;
    border:none;
    border-radius:8px;
    padding:8px 12px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
    flex-shrink:0;
    white-space:nowrap;
  }
  .check-btn:disabled{
    background:var(--rose-soft);
    color:var(--rose);
    cursor:default;
  }

  .add-row{display:flex;gap:8px;margin-top:12px;}
  input[type=text]{
    flex:1;
    background:var(--card);
    border:1px solid var(--rose-soft);
    border-radius:10px;
    padding:11px 14px;
    color:var(--ink);
    font-size:14px;
    font-family:inherit;
  }
  input[type=text]::placeholder{color:var(--muted);}
  input[type=text]:focus{outline:none;border-color:var(--rose);}
  button{font-family:inherit;}
  .btn-primary{
    background:var(--rose-btn);
    color:#FFFFFF;
    border:none;
    border-radius:10px;
    padding:11px 16px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    flex:none;
  }

  .history-item{
    display:flex;
    justify-content:space-between;
    padding:10px 16px;
    font-size:13px;
    border-bottom:1px solid var(--line);
    color:var(--muted);
  }
  .history-item:last-child{border-bottom:none;}
  .history-item b{color:var(--ink);font-weight:600;}

  .footer-note{text-align:center;color:var(--muted);font-size:11px;margin-top:36px;line-height:1.6;}
</style>
</head>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getDatabase, ref, onValue, set, push
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBtBxHi2XpTm3z8_5M6Am4mTCitLBr2k5M",
  authDomain: "lovebugfc-vest.firebaseapp.com",
  databaseURL: "https://lovebugfc-vest-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "lovebugfc-vest",
  storageBucket: "lovebugfc-vest.firebasestorage.app",
  messagingSenderId: "575454140491",
  appId: "1:575454140491:web:84401517f339413ba895ce"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const rosterRef = ref(db, 'roster');
const historyRef = ref(db, 'history');

let roster = { members: [] };
let history = [];
let rosterReady = false;

function getMondayLabel(date){
  const d = new Date(date);
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  const monday = new Date(d.setDate(diff));
  const end = new Date(monday);
  end.setDate(monday.getDate()+6);
  const fmt = (x)=>`${x.getMonth()+1}.${x.getDate()}`;
  return `${fmt(monday)} - ${fmt(end)}`;
}

function currentWeekLabel(){
  return getMondayLabel(new Date());
}

onValue(rosterRef, (snapshot) => {
  if(!snapshot.exists()){
    if(!rosterReady){
      const initialOrder = ['은령','수연','은유','장지은','은미','혜은','지숙','수아','수빈'];
      roster = { members: initialOrder.map(name => ({ name, count: 0 })) };
      saveRoster();
    }
  } else {
    const val = snapshot.val();
    roster = { members: Array.isArray(val.members) ? val.members : Object.values(val.members || {}) };
  }
  rosterReady = true;
  render();
}, (err) => {
  console.error('로스터 불러오기 실패', err);
});

onValue(historyRef, (snapshot) => {
  if(!snapshot.exists()){
    history = [];
  } else {
    const val = snapshot.val();
    history = Object.values(val);
  }
  render();
}, (err) => {
  console.error('기록 불러오기 실패', err);
});

async function saveRoster(){
  try{ await set(rosterRef, roster); }
  catch(e){ console.error('저장 실패', e); alert('저장에 실패했어요. 인터넷 연결을 확인해주세요.'); }
}
async function addHistoryEntry(name){
  try{ await push(historyRef, { week: currentWeekLabel(), name, at: new Date().toISOString() }); }
  catch(e){ console.error('기록 저장 실패', e); alert('기록 저장에 실패했어요. 인터넷 연결을 확인해주세요.'); }
}

function render(){
  if(!rosterReady) return;
  document.getElementById('memberCount').textContent = `${roster.members.length}명`;
  document.getElementById('weekLabel').textContent = `이번 주 (${currentWeekLabel()})`;

  const thisWeekDone = history.filter(h => h.week === currentWeekLabel());
  const statusEl = document.getElementById('weekStatus');
  if(thisWeekDone.length === 0){
    statusEl.className = 'week-status empty';
    statusEl.textContent = '이번 주 세탁 담당이 아직 체크되지 않았어요';
  } else {
    const tally = {};
    thisWeekDone.forEach(h => { tally[h.name] = (tally[h.name] || 0) + 1; });
    const parts = Object.entries(tally).map(([name, cnt]) =>
      `<b>${escapeHtml(name)}</b>${cnt > 1 ? ` x${cnt}` : ''}`
    );
    statusEl.className = 'week-status';
    statusEl.innerHTML = '이번 주 담당: ' + parts.join(', ');
  }

  renderBoard();
  renderHistory();
}

function renderBoard(){
  const board = document.getElementById('board');
  if(roster.members.length === 0){
    board.innerHTML = '<div class="board-empty">아직 멤버가 없어요</div>';
    return;
  }
  const sorted = [...roster.members].sort((a,b)=> b.count - a.count);
  const maxCount = Math.max(1, ...sorted.map(m=>m.count));
  board.innerHTML = sorted.map((m, i) => {
    const origIndex = roster.members.indexOf(m);
    return `
      <div class="board-row">
        <div class="rank ${i===0 && m.count>0 ? 'first':''}">${i+1}</div>
        <div class="board-name">${escapeHtml(m.name)}</div>
        <div class="board-bar-wrap"><div class="board-bar" style="width:${(m.count/maxCount)*100}%"></div></div>
        <div class="board-count">${m.count}회</div>
        <button class="check-btn" data-idx="${origIndex}">완료</button>
        <button class="del-btn" data-del="${origIndex}" title="삭제">✕</button>
      </div>`;
  }).join('');

  board.querySelectorAll('.check-btn').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      btn.disabled = true;
      const idx = parseInt(e.currentTarget.dataset.idx, 10);
      const member = roster.members[idx];
      const updatedMembers = roster.members.map((m, i) => i === idx ? { ...m, count: m.count + 1 } : m);
      roster = { members: updatedMembers };
      await saveRoster();
      await addHistoryEntry(member.name);
    });
  });

  board.querySelectorAll('.del-btn').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      const idx = parseInt(e.currentTarget.dataset.del, 10);
      const removed = roster.members[idx];
      if(!confirm(`${removed.name}님을 명단에서 삭제할까요?`)) return;
      const updatedMembers = roster.members.filter((_, i) => i !== idx);
      roster = { members: updatedMembers };
      await saveRoster();
    });
  });
}

function renderHistory(){
  const el = document.getElementById('historyBoard');
  document.getElementById('historyCount').textContent = history.length ? `총 ${history.length}건` : '';
  if(history.length === 0){
    el.innerHTML = '<div class="board-empty">아직 기록이 없어요</div>';
    return;
  }
  const recent = [...history].reverse().slice(0, 15);
  el.innerHTML = recent.map(h => `
    <div class="history-item">
      <span>${h.week}</span>
      <b>${escapeHtml(h.name)}</b>
    </div>
  `).join('');
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

document.getElementById('addBtn').addEventListener('click', addMember);
document.getElementById('nameInput').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') addMember();
});

async function addMember(){
  const input = document.getElementById('nameInput');
  const name = input.value.trim();
  if(!name) return;
  if(roster.members.some(m => m.name === name)){
    alert('이미 있는 이름이에요.');
    return;
  }
  roster = { members: [...roster.members, { name, count: 0 }] };
  input.value = '';
  await saveRoster();
}
</script>
</body>
